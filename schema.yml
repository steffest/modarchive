    LicenseEnum:
      enum:
      - publicdomain
      - by-nc
      - by-nc-nd
      - by-nc-sa
      - by-nd
      - by-sa
      - by
      - cc0
      type: string
      description: |-
        * `publicdomain` - Public Domain
        * `by-nc` - Non-commercial
        * `by-nc-nd` - Non-commercial No Derivatives
        * `by-nc-sa` - Non-commercial Share Alike
        * `by-nd` - No Derivatives
        * `by-sa` - Share Alike
        * `by` - Attribution
        * `cc0` - CC0
    LimitedArtist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
      required:
      - id
      - name
    NullEnum:
      enum:
      - null
    PaginatedArtistList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
    PaginatedSongListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/SongList'
    SongDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        title_from_file:
          type: string
          maxLength: 120
        filename:
          type: string
          maxLength: 120
        file_size:
          type: integer
          maximum: 2147483647
          minimum: 0
        channels:
          type: integer
          maximum: 32767
          minimum: 0
        format:
          $ref: '#/components/schemas/FormatEnum'
        instrument_text:
          type: string
          nullable: true
          maxLength: 64000
        comment_text:
          type: string
          nullable: true
          maxLength: 64000
        license:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LicenseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        genre:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenreEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_featured:
          type: boolean
          nullable: true
        featured_date:
          type: string
          format: date-time
          nullable: true
        stats:
          allOf:
          - $ref: '#/components/schemas/SongStats'
          readOnly: true
        artists:
          type: array
          items:
            $ref: '#/components/schemas/LimitedArtist'
          readOnly: true
      required:
      - artists
      - channels
      - file_size
      - filename
      - format
      - id
      - stats
      - title
    SongList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        title_from_file:
          type: string
          maxLength: 120
        filename:
          type: string
          maxLength: 120
        file_size:
          type: integer
          maximum: 2147483647
          minimum: 0
        channels:
          type: integer
          maximum: 32767
          minimum: 0
        format:
          $ref: '#/components/schemas/FormatEnum'
        license:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LicenseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        genre:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenreEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_featured:
          type: boolean
          nullable: true
        artists:
          type: array
          items:
            $ref: '#/components/schemas/LimitedArtist'
          readOnly: true
      required:
      - artists
      - channels
      - file_size
      - filename
      - format
      - id
      - title
    SongStats:
      type: object
      properties:
        downloads:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_comments:
          type: integer
          maximum: 32767
          minimum: 0
        average_comment_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        total_favorites:
          type: integer
          maximum: 2147483647
          minimum: 0
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
