openapi: 3.0.3
info:
  title: ModArchive API
  version: 1.0.0
  description: The Mod Archive JSON API
paths:
  /api/v1/artists/:
    get:
      operationId: artists_list
      description: List artists with optional filtering and ordering
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - average_song_rating
          - id
          - name
          - total_comments
          - total_downloads
          - total_songs
          default: name
        description: Ordering field (ascending, add a '-' in front to sort descending)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: starts_with
        schema:
          type: string
        description: Filter artists by first character of name (single character)
      tags:
      - artists
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistList'
          description: ''
  /api/v1/artists/{id}/:
    get:
      operationId: artists_retrieve
      description: Retrieve a specific artist
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this artist.
        required: true
      tags:
      - artists
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
          description: ''
  /api/v1/artists/{id}/songs:
    get:
      operationId: artists_songs_list
      description: Retrieve a list of songs by artist
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - artists
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSongListList'
          description: ''
  /api/v1/artists/search:
    get:
      operationId: artists_search_list
      description: Search for artists by name, ordered by search relevance
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Search by artist name
        required: true
      tags:
      - artists
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistList'
          description: ''
  /api/v1/genres:
    get:
      operationId: genres_list
      description: Get a list of available genres
      tags:
      - genres
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
          description: ''
  /api/v1/songs/:
    get:
      operationId: songs_list
      description: 'Retrieve a list of songs. At least one filter must be provided:
        starts_with, license, genre or file_format'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: starts_with
        schema:
          type: string
        description: Filter songs by first character of filename (single character)
      - in: query
        name: license
        schema:
          type: string
          enum:
          - by
          - by-nc
          - by-nc-nd
          - by-nc-sa
          - by-nd
          - by-sa
          - cc0
          - publicdomain
        description: Filter by license
      - in: query
        name: genre
        schema:
          type: string
          enum:
          - alternative
          - ballad
          - big-band
          - bluegrass
          - blues
          - chillout
          - chiptune
          - christmas
          - classical
          - comedy
          - country
          - demostyle
          - disco
          - easy-listening
