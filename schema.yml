components:
  schemas:
    Artist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        total_songs:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        total_comments:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        total_downloads:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        average_song_rating:
          type: number
          format: double
          nullable: true
      required:
      - id
      - name
    BlankEnum:
      enum:
      - ''
    FormatEnum:
      enum:
      - '669'
      - AHX
      - AMF
      - AMS
      - C67
      - DBM
      - DIGI
      - DMF
      - DSM
      - DSYM
      - DTM
      - FAR
      - FMT
      - GDM
      - HVL
      - IMF
      - IT
      - J2B
      - MED
      - MDL
      - MO3
      - MOD
      - MPTM
      - MT2
      - MTM
      - OKT
      - PLM
      - PSM
      - PTM
      - S3M
      - SFX
      - STM
      - STP
      - STX
      - SymMOD
      - ULT
      - UMX
      - XM
      type: string
      description: |-
        * `669` - 669: Composer 669 / UNIS 669
        * `AHX` - AHX: Abyss' Highest eXperience, formerly THX
        * `AMF` - AMF: ASYLUM / DSMI
        * `AMS` - AMS: Extreme's Tracker / Velvet Studio
        * `C67` - C67: CDFM / Composer 670
        * `DBM` - DBM: Digi Booster Pro
        * `DIGI` - DIGI: Digi Booster
        * `DMF` - DMF: X-Tracker
        * `DSM` - DSM: DSIK
        * `DSYM` - DSYM: Digital Symphony
        * `DTM` - DTM: Digital Tracker / Digital Home Studio
        * `FAR` - FAR: Farandole Composer
        * `FMT` - FMT: FM Tracker
        * `GDM` - GDM: BWSB Sound System
        * `HVL` - HVL: HivelyTracker
        * `IMF` - IMF: Imago Orpheus
        * `IT` - IT: Impulse Tracker
        * `J2B` - J2B: Galaxy Sound System
        * `MED` - MED: Octamed
        * `MDL` - MDL: Digitrakker
        * `MO3` - MO3: Compressed Module
        * `MOD` - MOD: Protracker, Generic MOD
        * `MPTM` - MPTM: OpenMPT
        * `MT2` - MT2: MadTracker 2
        * `MTM` - MTM: Multi Tracker
        * `OKT` - OKT: Oktalyzer
        * `PLM` - PLM: Disorder Tracker 2
        * `PSM` - PSM: Epic MegaGames MASI
        * `PTM` - PTM: PolyTracker
        * `S3M` - S3M: Scream Tracker 3
        * `SFX` - SFX: SoundFX / MultiMedia Sound
        * `STM` - STM: Scream Tracker
        * `STP` - STP: SoundTracker Pro II
        * `STX` - STX: Scream Tracker Music Interface Kit
        * `SymMOD` - SymMOD: Symphonie / Symphonie Pro
        * `ULT` - ULT: UltraTracker
        * `UMX` - UMX: Unreal Music
        * `XM` - XM: FastTracker 2
    Genre:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
      required:
      - id
      - text
    GenreEnum:
      enum:
      - electronic-techno
      - electronic-dance
      - electronic-ambient
      - trance-general
      - electronic-other
      - electronic-general
      - electronic-drum-and-bass
      - electronic-house
      - electronic-rave
