      - in: query
        name: is_featured
        schema:
          type: boolean
        description: Filter by featured status
      tags:
      - songs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSongListList'
          description: ''
  /api/v1/songs/{id}/:
    get:
      operationId: songs_retrieve
      description: Retrieve a specific song
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this song.
        required: true
      tags:
      - songs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongDetail'
          description: ''
  /api/v1/songs/{id}/download:
    get:
      operationId: songs_download_retrieve
      description: Download a song as a zip file
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - songs
      responses:
        '200':
          content:
            application/json:
              schema:
                application/zip:
                  type: string
                  format: binary
          description: Zipped song file
        '404':
          description: No response body
  /api/v1/songs/search:
    get:
      operationId: songs_search_list
      description: 'Search for songs with optional filtering. At least one of the
        following search parameters is required: title, filename, instrument_text,
        comment_text.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: title
        schema:
          type: string
        description: Search in song title
      - in: query
        name: filename
        schema:
          type: string
        description: Search in filename
      - in: query
        name: instrument_text
        schema:
          type: string
        description: Search in instrument text
      - in: query
        name: comment_text
        schema:
          type: string
        description: Search in comment text
      - in: query
        name: min_file_size
        schema:
          type: integer
        description: Minimum file size in bytes
      - in: query
        name: max_file_size
        schema:
          type: integer
        description: Maximum file size in bytes
      - in: query
        name: min_channels
        schema:
          type: integer
        description: Minimum number of channels
      - in: query
        name: max_channels
        schema:
          type: integer
        description: Maximum number of channels
      - in: query
        name: file_format
        schema:
          type: string
          enum:
          - '669'
          - AHX
          - AMF
          - AMS
          - C67
          - DBM
